<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線測試</title>
<style>
body{font-family:"PingFang TC","Noto Sans TC",sans-serif;padding:20px;line-height:1.7;background:#fff7fa;color:#4b3a52}
h1{font-size:1.3rem}
.row{background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.ok{color:#0f8a6b;font-weight:800}
.ng{color:#d14d6f;font-weight:800}
.wait{color:#9a86a0}
small{color:#9a86a0;word-break:break-all}
</style>
</head>
<body>
<h1>🔌 連線測試</h1>
<p>下面三項，會顯示「✅ 可連線」或「❌ 無法連線」。</p>

<div class="row"><div>① Firestore（保存用）</div><div id="r1" class="wait">測試中…</div><small id="u1"></small></div>
<div class="row"><div>② Google 配信（Firebase 用）</div><div id="r2" class="wait">測試中…</div><small id="u2"></small></div>
<div class="row"><div>③ esm.sh 配信（Firebase 用）</div><div id="r3" class="wait">測試中…</div><small id="u3"></small></div>

<script>
async function check(id, url, uid){
  document.getElementById(uid).textContent = url;
  const el = document.getElementById(id);
  try{
    const res = await fetch(url, {cache:"no-store"});
    // 404 や 403 でも「届いた」ことには変わりない
    el.innerHTML = `<span class="ok">✅ 可連線</span>（回應 ${res.status}）`;
  }catch(err){
    el.innerHTML = `<span class="ng">❌ 無法連線</span>`;
  }
}
check("r1","https://firestore.googleapis.com/v1/projects/sydney-3fca6/databases/(default)/documents/trip/progress","u1");
check("r2","https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","u2");
check("r3","https://esm.sh/firebase@10.12.2/app","u3");
</script>
</body>
</html>
